name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          pip install -r requirements_test.txt
          # The panel depends on the frontend integration: install the
          # frontend package pinned by the installed Home Assistant.
          pip install "$(python scripts/frontend_requirement.py)"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Run tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend_src/package-lock.json
      - name: Build the panel
        working-directory: frontend_src
        run: npm ci && npm run build
      - name: Check the committed bundle is up to date
        run: git diff --exit-code custom_components/crosspoint/frontend
