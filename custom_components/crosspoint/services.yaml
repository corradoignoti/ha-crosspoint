send_book:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: crosspoint
    file:
      required: true
      example: "Dune.epub"
      selector:
        text:
    overwrite:
      default: false
      selector:
        boolean:
    optimize:
      selector:
        boolean:
    split_chapters:
      selector:
        boolean:

remove_book:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: crosspoint
    file:
      required: true
      example: "Dune.epub"
      selector:
        text:
    forget_missing:
      default: false
      selector:
        boolean:

rescan_library:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: crosspoint

reconcile_device:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: crosspoint

send_wallpaper:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: crosspoint
    file:
      required: true
      example: "sea.png"
      selector:
        text:
    mode:
      default: normal
      selector:
        select:
          translation_key: wallpaper_mode
          options:
            - normal
            - transparent
    force:
      default: false
      selector:
        boolean:

remove_wallpaper:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: crosspoint
    file:
      required: true
      example: "sea.png"
      selector:
        text:
    forget_missing:
      default: false
      selector:
        boolean:

refresh_reading_stats:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: crosspoint
