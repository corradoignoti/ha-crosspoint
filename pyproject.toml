[project]
name = "ha-crosspoint"
version = "0.3.1"
description = "Home Assistant custom integration for CrossPoint e-readers"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# Explicit timeout parameters are part of the client API, not a misuse.
ignore = ["ASYNC109"]
